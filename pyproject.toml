[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peaches-book"
version = "0.1.0"
description = "Offline, non-authoritative PEACHES provenance stamps and test-book checker"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.1"]

[project.scripts]
peaches-book = "peaches_book.cli:main"

[tool.setuptools.packages.find]
include = ["peaches_book*"]
