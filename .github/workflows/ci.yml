name: Book of Peaches CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned test dependencies
        run: python -m pip install "cryptography==50.0.1" "pytest==8.4.2" "."
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m pip install build==1.3.0 && python -m build --wheel
